name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 毎日 00:10 JST。Publications「最新」と News の 365 日の窓を進めるための定期ビルド
    - cron: "10 15 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.140.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Hugo (extended)
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${RUNNER_TEMP}/hugo.deb"
          hugo version

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build
        env:
          TZ: Asia/Tokyo
        run: hugo --source hugo --destination "${GITHUB_WORKSPACE}/_site"

      - name: Check output
        run: |
          test -f _site/index.html
          test -f _site/en/index.html
          test -f _site/404.html
          test "$(cat _site/CNAME)" = "www.akg.t.u-tokyo.ac.jp"
          du -sh _site
          # Pages の公開サイズ上限は 1 GB。900 MB を超えたら失敗させて気づけるようにする
          test "$(du -sm _site | cut -f1)" -lt 900

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
