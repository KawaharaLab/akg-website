approach:
  lead: "研究テーマに必要な要素技術の開発から、システムの試作、実験・評価まで、一連のプロセスに取り組んでいます。"
  leadEn: "Our research spans the development of core technologies, system prototyping, and experimental evaluation."
  steps:
    - title: "要素技術の開発"
      titleEn: "Core technologies"
      text: "材料、センサ、回路、計算手法などの要素技術を研究します。"
      textEn: "We develop materials, sensing, circuits and computational techniques."
    - title: "システムの試作"
      titleEn: "System prototyping"
      text: "ハードウェアとソフトウェアを組み合わせ、試作機を開発します。"
      textEn: "We build functional prototypes integrating hardware and software."
    - title: "実験と評価"
      titleEn: "Experimental evaluation"
      text: "性能や使いやすさを検証し、研究成果として発表します。"
      textEn: "We evaluate performance and usability, and publish the results."

people:
  text: "複数の教員・研究者と学生が、それぞれの専門性を生かして研究を進めています。"
  textEn: "Faculty, researchers and students work together across disciplines."

join:
