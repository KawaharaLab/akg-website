about:
  - ja: "AKGは、材料・デバイスからAIまでを横断する東京大学の研究グループです。センシング、無線給電、デジタルファブリケーション、ロボティクスなどの研究を行っています。"
    en: "AKG is a research group at the University of Tokyo. We work across materials, devices, sensing, wireless power, digital fabrication, robotics and AI."
  - ja: "必要な要素技術を開発し、ハードウェアとソフトウェアを組み合わせて試作し、実際の環境で評価します。"
    en: "We develop the necessary technologies, build hardware and software prototypes, and evaluate them through experiments in real environments."

