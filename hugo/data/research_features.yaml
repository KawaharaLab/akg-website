- id: '5727'
  title: '超低電力な指輪型マウス'
  titleEn: 'An ultra-low-power mouse ring'
  description: '指輪と手首のコイルで小さな動きを捉え、少ない電力で入力する。'
  descriptionEn: 'Sense small movements with coils on the finger and wrist, enabling input with little power.'
- id: '5783'
  title: 'asEars：片耳難聴者の聞こえを支える'
  titleEn: 'asEars: supporting people with single-sided deafness'
  description: '骨導音を利用したデバイスを設計し、生活の中での使い心地を評価する。'
  descriptionEn: 'Design devices using bone-conducted sound and evaluate the experience of using them in everyday life.'
- id: '4790'
  title: 'MilliSign：視界不良でも読める標識'
  titleEn: 'MilliSign: signs readable in poor visibility'
  description: 'ミリ波レーダで読み取る標識を使い、視界の悪い環境でドローンを誘導する。'
  descriptionEn: 'Guide drones in poor visibility with signs read by millimetre-wave radar.'
- id: '4815'
  title: 'Inkjet 4D Print：印刷から立体へ'
  titleEn: 'Inkjet 4D Print: from printing to 3D objects'
  description: '平面に印刷したパターンを加熱し、複雑な折紙の形へ自動的に折り上げる。'
  descriptionEn: 'Heat patterns printed on a flat sheet to make them fold automatically into complex origami shapes.'
- id: '4761'
  title: '縞模様を対話的に設計する'
  titleEn: 'Designing stripe patterns interactively'
  description: 'ベクトル場に沿った縞模様の特異点を編集し、模様の形を制御する。'
  descriptionEn: 'Edit singularities in field-aligned stripe patterns to control their shape.'
- id: '3868'
  title: 'Pop-up Print：折りたたんで印刷する'
  titleEn: 'Pop-up Print: printing in a folded state'
  description: '折りたたんだ状態で造形し、あとから展開できる双安定な構造をつくる。'
