# 各領域の代表研究。meaning は「何をしたか」の一行で、すべて動詞で終える。
# 研究室の言葉に置き換えてください。
perceive:
  - title: "Geometric-Photometric Event-based 3D Gaussian Ray Tracing"
    url: "/publications-2026/#event-ray-tracing"
    titleJa: "イベントベース 3D ガウシアン・レイトレーシング"
    meaning: "イベントカメラの信号だけから、物体の形と明るさを同時に復元する。"
    titleEn: "Event-based 3D Gaussian ray tracing"
    meaningEn: "Recover an object's shape and brightness at once from event-camera signals alone."
    venue: "CVPR 2026"
  - title: "Temporal Modification of Speech for the Enhancement of Selective Listening"
    url: "/publications-2026/#selective-listening"
    titleJa: "選択的聴取のための音声の時間変形"
    meaning: "二人の声を分離するのではなく、話す速さをずらして、聞き手が聞き分けられるようにする。"
    titleEn: "Temporal modification of speech for selective listening"
    meaningEn: "Instead of separating two voices, shift their speaking rates so the listener can tell them apart."
    venue: "APSIPA ASC 2026"
  - title: "話者非依存日本手話認識における Movement-Hold モデルに基づくキーフレーム選択"
    url: "/publications-2026/#sign-language"
    titleJa: "話者非依存の日本手話認識"
    meaning: "手話を動きと静止で区切り、要となるフレームだけを使って、誰の手話でも認識できるようにする。"
    titleEn: "Signer-independent Japanese Sign Language recognition"
    meaningEn: "Split signing into movement and hold, keep only the key frames, and recognise anyone's signing."
    venue: "MIRU 2026"

think:
  - title: "反射行動層によるゲーティングを利用したフィジカルAIチップの省電力効果の試算"
    url: "/publications-2026/#reflex-gating"
    titleJa: "Physical AI チップの反射行動層ゲーティング"
    meaning: "反射で対応できる入力のときは上位の処理を起動しないことで、電力を節約する。"
    titleEn: "Reflex-layer gating for a Physical AI chip"
    meaningEn: "Save power by not waking the higher-level processing when a reflex can handle the input."
    venue: "信学ソ大 2026"
  - title: "LLMによるルールベース空調制御の自動生成と反復改善"
    url: "/publications-2026/#llm-hvac"
    titleJa: "LLM による空調制御ルールの自動生成"
    meaning: "空調の制御ルールを人が書く代わりに言語モデルに書かせ、運用しながら改善する。"
    titleEn: "LLM-generated rules for air-conditioning control"
    meaningEn: "Let a language model write the control rules instead of a person, and refine them in operation."
    venue: "信学ソ大 2026"
  - title: "世界モデルにおけるイベントベースの適応的なフレームサンプリング"
    url: "/publications-2026/#world-model-sampling"
    titleJa: "世界モデルの適応的フレームサンプリング"
    meaning: "一定間隔で画像を送るのをやめ、変化があったときだけ世界モデルに渡す。"
    titleEn: "Adaptive frame sampling for world models"
    meaningEn: "Stop sending frames at fixed intervals; hand the world model a frame only when something changes."
    venue: "MIRU 2026"
    crosses: "わかる"

act:
  - title: "生活支援ロボットの安全な作業遂行に向けた力触覚情報に基づく接触状態の認識"
    url: "/publications-2026/#haptic-contact"
    titleJa: "力触覚に基づく接触状態の認識"
    meaning: "力の感覚と言葉を結びつけて学習させ、カメラに頼らずにロボットの動作を決める。"
    titleEn: "Contact-state recognition from haptic data"
    meaningEn: "Tie force sensing to language so a robot can decide its next move without relying on a camera."
    venue: "DICOMO 2026 優秀プレゼンテーション賞"
  - title: "Acoustic-Based Internal State Sensing for Jamming Grippers to Predict Grasp State"
    url: "/publications-2026/#acoustic-gripper"
    titleJa: "ジャミンググリッパの音響による内部状態センシング"
    meaning: "カメラも力センサも使わず、グリッパの中で鳴る音からつかめたかどうかを判定する。"
    titleEn: "Acoustic internal-state sensing for jamming grippers"
    meaningEn: "Judge whether the grasp succeeded from the sound inside the gripper, with no camera or force sensor."
    venue: "IEEE 2026"
    crosses: "わかる"
  - title: "オノマトペを通じた質感情報伝達に向けた触覚データの言語的接地の評価"
    url: "/publications-2026/#touch-onomatopoeia"
    titleJa: "オノマトペによる触覚の言語的接地"
    meaning: "「ざらざら」「つるつる」といった擬態語に、センサで測った触覚を対応づける。"
    titleEn: "Grounding touch in onomatopoeia"
    meaningEn: "Map measured tactile data onto words like ‘rough’ and ‘smooth’."
    venue: "DICOMO 2026"

dissolve:
  - title: "picoRing mouse: 極低電力な指輪型無線マウス"
