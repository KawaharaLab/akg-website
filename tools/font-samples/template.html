<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AKG — フォント比較</title>
<style>__FONTS__</style>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f3f0;color:#171717;font:14px/1.7 system-ui,sans-serif}header{max-width:1440px;margin:auto;padding:28px 28px 18px}h1{font-size:24px;margin:0 0 10px}.toolbar{display:flex;gap:16px;align-items:center;flex-wrap:wrap}select,button,input{font:inherit}select,button{padding:6px 10px}#status{font-size:12px;color:#666}main{max-width:1440px;margin:auto;padding:0 28px 40px;display:grid;grid-template-columns:1fr 1fr;gap:24px}.sample{background:white;border:1px solid #ddd;min-width:0}.label{padding:16px 24px;border-bottom:1px solid #ddd;font:13px/1.6 system-ui,sans-serif}.label strong{display:block;font-size:16px}.label a{color:#555}.stage{padding:32px;font-family:var(--latin),var(--jp),sans-serif;font-size:var(--body,16px);font-weight:400;line-height:1.95}.navigation{display:flex;flex-wrap:wrap;gap:8px 15px;font-family:var(--latin);font-size:13px;margin-bottom:36px}.title{font-family:var(--latin);font-size:var(--heading,52px);font-weight:500;line-height:1.08;letter-spacing:-.04em;margin:0}.subtitle{font-family:var(--jp);font-size:14px;font-weight:500;line-height:1.6;letter-spacing:.04em;color:#a81b36;margin:12px 0 28px}.statement{font-size:22px;font-weight:500;line-height:1.7;margin:0 0 18px}.body{margin:0 0 28px}.verbs{display:grid;grid-template-columns:1fr 1fr;gap:14px;border-top:1px solid #ddd;padding-top:20px;font-size:21px;font-weight:500}.verbs small{font-size:12px;font-weight:400;color:#666}.paper{border-top:1px solid #ddd;margin-top:24px;padding-top:18px}.paper h3{font-size:18px;line-height:1.45;font-weight:500;margin:0 0 6px}.paper p{font-size:13px;line-height:1.6;margin:4px 0}.paper a{color:#a81b36;font-size:12px}.single{grid-template-columns:1fr;max-width:1100px}.single .stage{padding:48px 64px}.single .body{max-width:52em}.sample[hidden]{display:none}.summary{margin:8px 0 14px;color:#555}@media(max-width:800px){main{grid-template-columns:1fr;padding:0 14px 30px}.stage,.single .stage{padding:24px}header{padding:24px 14px}.title{font-size:min(var(--heading,52px),12vw)}}
</style>
<header><h1>AKG フォント比較</h1><p class="summary">同じ文章・サイズ・余白で4種類を比較します。サイトのフォントはまだ変更していません。サンプル用の文字を埋め込んでいるので、保存後はオフラインでも表示できます。</p><div class="toolbar"><label>表示 <select id="mode"><option value="all">4案を比較</option><option value="A">A 現在</option><option value="B">B ニュートラル</option><option value="C">C 技術・研究</option><option value="D">D 明朝・セリフ</option></select></label><label>本文 <input id="bodySize" type="range" min="14" max="18" value="16"> <output id="bodyValue">16px</output></label><label>見出し <input id="headingSize" type="range" min="40" max="64" value="52"> <output id="headingValue">52px</output></label></div><p id="status" role="status">フォントを読み込み中…</p></header>
<main id="samples"></main>
<template id="sample"><article class="sample"><div class="label"></div><div class="stage"><nav class="navigation">Research　People　Publications　News　Engagement　About</nav><h2 class="title">Research</h2><p class="subtitle">研究</p><p class="statement">材料から知能まで、現実世界で使える技術をつくる。</p><p class="body">日常生活に計算を組み込むことが、研究の根底にあります。センサ・材料・回路・AIを一緒に設計し、実環境で試します。</p><div class="verbs"><span>Perceive <small>/ わかる</small></span><span>Think <small>/ 考える</small></span><span>Act <small>/ はたらきかける</small></span><span>Dissolve <small>/ とけこむ</small></span></div><div class="paper"><h3>Ultra-Low-Power Wireless Ring Mouse</h3><p>R. Takahashi, Y. Li, M. Fukumoto, and Y. Kawahara</p><p>Electronics and Communications in Japan · 2026</p><p>超低電力な指輪型マウス</p><a>DOI ↗　研究紹介 →</a></div></div></article></template>
<script>
const variants=[['A','現在の組み合わせ','Schibsted Grotesk','Zen Kaku Gothic New'],['B','ニュートラルなゴシック','Inter','Noto Sans JP'],['C','技術・研究の印象','IBM Plex Sans','IBM Plex Sans JP'],['D','明朝・セリフ','Source Serif 4','Noto Serif JP']];
for(const [id,label,latin,jp] of variants){const card=document.getElementById('sample').content.firstElementChild.cloneNode(true);card.dataset.variant=id;card.style.setProperty('--latin','"'+latin+'"');card.style.setProperty('--jp','"'+jp+'"');const title=document.createElement('strong');title.textContent=id+' — '+label;const names=document.createElement('p');names.style.margin='4px 0 0';for(const [i,font] of [latin,jp].entries()){if(i)names.append(' × ');const a=document.createElement('a');a.textContent=font;a.href='https://fonts.google.com/specimen/'+encodeURIComponent(font);a.target='_blank';a.rel='noopener noreferrer';names.append(a);}card.querySelector('.label').append(title,names);document.getElementById('samples').append(card);}
document.getElementById('mode').onchange=e=>{document.getElementById('samples').classList.toggle('single',e.target.value!=='all');document.querySelectorAll('.sample').forEach(c=>c.hidden=e.target.value!=='all'&&c.dataset.variant!==e.target.value);};
for(const [id,prop] of [['body','--body'],['heading','--heading']])document.getElementById(id+'Size').oninput=e=>{document.documentElement.style.setProperty(prop,e.target.value+'px');document.getElementById(id+'Value').textContent=e.target.value+'px';};
Promise.all(variants.flatMap(([, ,latin,jp])=>[document.fonts.load('400 16px "'+latin+'"','Research'),document.fonts.load('500 52px "'+latin+'"','Research'),document.fonts.load('400 16px "'+jp+'"','研究'),document.fonts.load('500 22px "'+jp+'"','研究')])).then(()=>document.fonts.ready).then(()=>{const loaded=variants.every(([, ,latin,jp])=>document.fonts.check('400 16px "'+latin+'"','Research')&&document.fonts.check('400 16px "'+jp+'"','研究'));document.getElementById('status').textContent=loaded?'全8書体を読み込み済み':'一部のフォントを読み込めませんでした';}).catch(()=>document.getElementById('status').textContent='フォントの読込に失敗しました');
</script></html>
